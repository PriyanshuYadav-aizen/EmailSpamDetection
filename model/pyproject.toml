[project]
name = "email-spam-detection-model"
version = "2.0.0"
description = "Ensemble email spam classifier combining Rule Engine, TF-IDF, and LSTM."
authors = [
    { name = "Email Spam Detection Team" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "tensorflow>=2.18",
    "scikit-learn>=1.5",
    "pandas>=2.0",
    "numpy>=1.26",
    "joblib>=1.4",
    "pydantic>=2.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "PTH"]
ignore = ["E501"] # Ignore long lines (formatted by Ruff anyway)

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
