name: Uptime Pinger

on:
  schedule:
    # Run every 10 minutes to prevent Render free-tier services from sleeping
    - cron: "*/10 * * * *"
  workflow_dispatch: # Allow manual triggering

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Node.js Server
        run: curl -s https://spam-node-server.onrender.com/health > /dev/null

      - name: Ping Python ML API
        run: curl -s https://spam-model-api.onrender.com/health > /dev/null

      - name: Ping React Client
        run: curl -s https://spam-client.onrender.com > /dev/null
